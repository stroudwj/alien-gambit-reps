<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Alien Gambit Reps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: board left, working panel right; stacks to one column on phones. Cool slate neutrals, a single teal accent, warm board. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#17202a; --muted:#5b6673; --line:#d9dfe6;
  --accent:#0f8b8d; --accent-fg:#ffffff; --accent-soft:#d8efef;
  --good:#2f8f4e; --warn:#c77d10; --bad:#c43d3d; --good-soft:#dff3e5; --warn-soft:#fbeedb; --bad-soft:#f9e0e0;
  --sq-light:#f0d9b5; --sq-dark:#b58863; --sq-sel:#f6f669; --sq-last:rgba(155,199,0,.41); --sq-bad:rgba(220,60,60,.6);
  --piece-w:#fbf8f1; --piece-w-stroke:#2a2a2a; --piece-b:#1d1a17; --piece-b-stroke:#000;
  --display:"Sora",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121820; --panel:#1a222c; --fg:#e8edf2; --muted:#9aa6b3; --line:#2b3642;
  --accent:#3fc1c0; --accent-fg:#0b1418; --accent-soft:#163b3d;
  --good:#5ccb7c; --warn:#e3a33a; --bad:#ef6b6b; --good-soft:#1c3826; --warn-soft:#3d2d12; --bad-soft:#42201f;
  --sq-light:#f0d9b5; --sq-dark:#b58863; --sq-sel:#f6f669; --sq-last:rgba(155,199,0,.41);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1a222c; --fg:#e8edf2; --muted:#9aa6b3; --line:#2b3642;
  --accent:#3fc1c0; --accent-fg:#0b1418; --accent-soft:#163b3d;
  --good:#5ccb7c; --warn:#e3a33a; --bad:#ef6b6b; --good-soft:#1c3826; --warn-soft:#3d2d12; --bad-soft:#42201f;
  --sq-light:#f0d9b5; --sq-dark:#b58863; --sq-sel:#f6f669; --sq-last:rgba(155,199,0,.41);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;border-bottom:1px solid var(--line);padding-bottom:10px}
header h1{font-size:1.35rem;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem}
.stats{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.main{display:grid;grid-template-columns:minmax(280px,560px) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.boardcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.boardwrap{position:relative;width:100%;max-width:560px;aspect-ratio:1;user-select:none;touch-action:none;border-radius:6px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--sq-light)}.sq.d{background:var(--sq-dark)}
.sq.last::before,.sq.sel::before,.sq.bad::before{content:"";position:absolute;inset:0}
.sq.last::before{background:var(--sq-last)}
.sq.sel::before{background:var(--sq-sel);opacity:.75}
.sq.bad::before{background:var(--sq-bad)}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.18);z-index:3}
.sq.dot.cap::after{width:86%;height:86%;background:none;border:5px solid rgba(0,0,0,.18)}
.sq .coord{position:absolute;font-family:var(--mono);font-size:.62rem;opacity:.6;pointer-events:none}
.sq .coord.f{right:3px;bottom:1px}.sq .coord.r{left:3px;top:1px}
.pc{position:absolute;inset:0;z-index:2;background-size:88%;background-position:center;background-repeat:no-repeat;cursor:grab;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.pc.drag{position:fixed;inset:auto;width:var(--sqsize,64px);height:var(--sqsize,64px);z-index:50;transform:translate(-50%,-50%);background-size:95%}

.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.under{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:36px}
.movelist{font-family:var(--mono);font-size:.86rem;line-height:1.8;min-height:2.2em;word-break:break-word}
.movelist .n{color:var(--muted);margin-right:2px}
.movelist .m{padding:1px 4px;border-radius:4px}
.movelist .m.cur{background:var(--accent-soft)}
.movelist .m.todo{color:var(--muted);opacity:.55}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 8px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabpane[hidden]{display:none}
.tabpane{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:420px}
.btn{padding:9px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.learn{background:var(--warn-soft);color:var(--warn)}
.chip.due{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.idle{background:var(--line);color:var(--muted)}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.92rem}
.msg{font-size:1rem;font-weight:500;min-height:1.5em}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:10px 6px;border-radius:7px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.rate button small{font-weight:400;color:var(--muted);font-family:var(--mono);font-size:.74rem}
.rate .again{border-color:var(--bad);color:var(--bad)}.rate .hard{border-color:var(--warn);color:var(--warn)}

.hint{color:var(--muted);font-size:.88rem}
.linelist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.linerow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px}

.linerow .mv b{font-weight:500;color:var(--accent)}
.linerow .meta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);grid-column:1/-1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.82rem}

.crumbs{font-family:var(--mono);font-size:.86rem;line-height:1.9;word-break:break-word}

.crumbs button:hover{background:var(--accent-soft)}
.crumbs button.cur{background:var(--accent-soft)}
.cands{display:flex;flex-direction:column;gap:4px}
.cand{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:7px;text-align:left}
.cand:hover{border-color:var(--accent)}
.cand .san{font-family:var(--mono);font-weight:500}
.cand .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}

.kv input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sr{position:absolute;left:-9999px}

}
function previewIvl(key, grade){ const r=rec(key); if(grade===0) return "10 min";
  let ivl; if(grade===1) ivl = r.ivl===0?1:Math.max(1,Math.round(r.ivl*1.2)); else if(grade===2) ivl = r.ivl===0?1:(r.ivl===1?3:Math.round(r.ivl*r.ease)); else ivl = r.ivl===0?4:Math.round(r.ivl*r.ease*1.3);
  return ivl===1?"1 day":ivl+" days"; }
function counts(){
  const c={new:0,due:0,learn:0,ok:0}; LINES.forEach(L=>c[stateOf(L.key)]++); return c;
}
function buildQueue(){
  const now=Date.now();
  const due = LINES.filter(L=>{const r=rec(L.key); return r.state!=="new" && r.due<=now;}).sort((a,b)=>rec(a.key).due-rec(b.key).due);
  const room = Math.max(0, settings.newPerDay - daily.introduced);
  const fresh = LINES.filter(L=>rec(L.key).state==="new").slice(0, room);
  return due.concat(fresh);
}

/* ---------- board ---------- */
const boardEl = $("#board"), wrapEl = $("#boardwrap"), arrowsEl = $("#arrows");
const game = new Chess();
let selected=null, lastMove=null, onUserMove=null, interactive=false, dragEl=null, dragFrom=null;
(function buildBoard(){
  for(let r=8;r>=1;r--) for(let f=0;f<8;f++){
    const sq=document.createElement("div"); const name=FILES[f]+r;
    sq.className="sq "+(((f+r)%2)?"d":"l"); sq.dataset.sq=name;
    if(r===1) sq.insertAdjacentHTML("beforeend",`<span class="coord f">${FILES[f]}</span>`);
    if(f===0) sq.insertAdjacentHTML("beforeend",`<span class="coord r">${r}</span>`);
    boardEl.appendChild(sq);
  }
  new ResizeObserver(()=>{ wrapEl.style.setProperty("--sqsize", (wrapEl.clientWidth/8)+"px"); }).observe(wrapEl);
})();
function sqEl(name){ return boardEl.querySelector(`[data-sq="${name}"]`); }
function render(){
  boardEl.querySelectorAll(".pc").forEach(e=>e.remove());
  boardEl.querySelectorAll(".sq").forEach(s=>s.classList.remove("last","sel","dot","cap","bad"));
  game.board().forEach((row,ri)=>row.forEach((p,fi)=>{ if(!p) return;
    const name=FILES[fi]+(8-ri); const el=document.createElement("span"); el.className="pc "+p.color+p.type.toUpperCase(); el.dataset.piece=p.color+p.type; sqEl(name).appendChild(el); }));
  if(lastMove){ sqEl(lastMove.from).classList.add("last"); sqEl(lastMove.to).classList.add("last"); }
  boardEl.querySelectorAll(".coord").forEach(c=>c.style.display=settings.showCoords?"":"none");
}
function xy(name){ return [FILES.indexOf(name[0])+0.5, 8-parseInt(name[1])+0.5]; }
function drawArrow(from,to,color){
  const [x1,y1]=xy(from),[x2,y2]=xy(to); const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy); const ux=dx/len,uy=dy/len;
  const ex=x2-ux*0.42, ey=y2-uy*0.42;
  arrowsEl.innerHTML += `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="0.17" stroke-linecap="round" opacity=".85"/>`+
   `<polygon points="${x2-ux*0.5-uy*0.22},${y2-uy*0.5+ux*0.22} ${x2-ux*0.5+uy*0.22},${y2-uy*0.5-ux*0.22} ${x2-ux*0.05},${y2-uy*0.05}" fill="${color}" opacity=".85"/>`;
}
function clearArrows(){ arrowsEl.innerHTML=""; }
function showHintArrow(san){
  const m = game.moves({verbose:true}).find(m=>norm(m.san)===norm(san)); if(m) drawArrow(m.from,m.to,"#0f8b8d");
}
function select(name){
  boardEl.querySelectorAll(".sq").forEach(s=>s.classList.remove("sel","dot","cap"));
  selected=name; if(!name) return;
  sqEl(name).classList.add("sel");
  game.moves({square:name, verbose:true}).forEach(m=>{ const t=sqEl(m.to); t.classList.add("dot"); if(m.captured) t.classList.add("cap"); });
}
function tryUserMove(from,to){
  const m = game.move({from,to,promotion:"q"}); select(null);
  if(!m) return false;
  if(onUserMove) onUserMove(m);
  return true;
}
wrapEl.addEventListener("pointerdown", e=>{
  if(!interactive) return;
  const sq = e.target.closest(".sq"); if(!sq) return; const name=sq.dataset.sq;
  const p = game.get(name);
  if(selected && selected!==name && (!p || p.color!==game.turn())){ tryUserMove(selected,name); return; }
  if(p && p.color===game.turn()){
    select(name); dragFrom=name;
    const pc=sq.querySelector(".pc"); if(!pc) return;
    dragEl=pc.cloneNode(true); dragEl.classList.add("drag"); dragEl.style.setProperty("--sqsize", wrapEl.style.getPropertyValue("--sqsize")); document.body.appendChild(dragEl);
    dragEl.style.left=e.clientX+"px"; dragEl.style.top=e.clientY+"px"; pc.style.opacity=".3";
    wrapEl.setPointerCapture(e.pointerId);
  } else select(null);
});
wrapEl.addEventListener("pointermove", e=>{ if(dragEl){ dragEl.style.left=e.clientX+"px"; dragEl.style.top=e.clientY+"px"; } });
wrapEl.addEventListener("pointerup", e=>{
  if(!dragEl) return; dragEl.remove(); dragEl=null;
  const src=sqEl(dragFrom); const pc=src&&src.querySelector(".pc"); if(pc) pc.style.opacity="";
  const el=document.elementFromPoint(e.clientX,e.clientY); const sq=el&&el.closest(".sq");
  if(sq && sq.dataset.sq!==dragFrom){ tryUserMove(dragFrom, sq.dataset.sq); }
  dragFrom=null;
});
wrapEl.addEventListener("pointercancel", ()=>{ if(dragEl){dragEl.remove();dragEl=null;} dragFrom=null; });

function playSan(san){ const m=game.move(san); if(m){ lastMove=m; } render(); return m; }

/* ---------- training session ---------- */
const T = { queue:[], pos:0, line:null, ply:0, mistakes:0, hinted:false, phase:"idle", mode:"srs", timer:null };
const paneTrain = $("#pane-train");
function setTab(name){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name));
  ["train","lines","explore","settings"].forEach(t=>$("#pane-"+t).hidden = t!==name);
  if(name==="lines") renderLines(); if(name==="explore") renderExplore(true); if(name==="settings") renderSettings();
  if(name==="train" && T.phase==="idle") renderTrainHome();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click", ()=>setTab(b.dataset.tab)));

function renderStats(){
  const c=counts(); const room=Math.max(0, settings.newPerDay-daily.introduced);
  $("#stats").innerHTML = `<span>due <b>${c.due}</b></span><span>new <b>${Math.min(c.new,room)}</b>/${c.new}</span><span>learning <b>${c.learn}</b></span><span>known <b>${c.ok}</b></span><span>lines <b>${LINES.length}</b></span>`;
}
function renderTrainHome(){
  T.phase="idle"; interactive=false; clearArrows(); clearTimeout(T.timer);
  game.reset(); lastMove=null; render(); $("#movelist").innerHTML=""; $("#under").innerHTML="";
  const q=buildQueue(); const c=counts();
  paneTrain.innerHTML = `
    <h2 style="font-size:1.1rem">Today's session</h2>
    <div class="status"><span class="chip due">${c.due} due</span><span class="chip new">${Math.min(c.new, Math.max(0,settings.newPerDay-daily.introduced))} new</span><span class="chip learn">${c.learn} learning</span><span class="chip ok">${c.ok} known</span></div>
    <p class="hint">You play White from move 1. Black's replies come from the repertoire tree. A mistake sends the line back to the start of the schedule, just like a missed rep.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="startSrs" ${q.length?"":"disabled"}>Start review (${q.length})</button>
      <button class="btn" id="startAll">Practice random lines</button>
    </div>
    ${q.length? "" : `<div class="note">Nothing is due. Raise "new lines per day" in Settings or practice random lines.</div>`}
    <h3 style="font-size:.95rem;margin-top:6px">About this repertoire</h3>
    <p class="hint">${LINES.length} lines built from ${DATA_INFO.games.toLocaleString()} Lichess games (2000+ rated, blitz/rapid/classical) that reached 5.Ng5. At each White move the repertoire follows the best-scoring popular move (6.Nxf7 and 7.Nf3 fixed as the gambit trunk); every Black reply with a meaningful share of games gets its own line. ★ marks the repertoire move in Explore.</p>`;
  $("#startSrs").addEventListener("click", ()=>startSession("srs"));
  $("#startAll").addEventListener("click", ()=>startSession("random"));
  renderStats();
}
function startSession(mode){
  T.mode=mode;
  T.queue = mode==="srs" ? buildQueue() : LINES.slice().sort(()=>Math.random()-0.5);
  T.pos=0; if(!T.queue.length){ renderTrainHome(); return; }
  startLine(T.queue[0]);
}
function drillOne(L){ T.mode="single"; T.queue=[L]; T.pos=0; setTab("train"); startLine(L); }
function startLine(L){
  T.line=L; T.ply=0; T.mistakes=0; T.hinted=false; T.phase="playing"; clearTimeout(T.timer);
  game.reset(); lastMove=null; clearArrows();
  if(settings.startAtGambit){ for(let i=0;i<9 && i<L.len;i++){ playSan(L.nodes[i].s); T.ply=i+1; } }
  render(); renderPlaying("Your move."); stepLine();
}
function stepLine(){
  const L=T.line; if(T.ply>=L.len){ finishLine(); return; }
  const node=L.nodes[T.ply];
  if(T.ply%2===1){ // black's reply
    interactive=false; T.timer=setTimeout(()=>{ playSan(node.s); T.ply++; renderPlaying(node.n? node.n : "Your move."); stepLine(); }, settings.autoSpeed);
  } else {
    interactive=true; onUserMove=handleUserMove;
    const st=stateOf(L.key);
    if(settings.hintsNew && (st==="new" || T.hinted)) { clearArrows(); showHintArrow(node.s); }
    if(node.n && T.ply>0) renderPlaying(node.n);
  }
}
function handleUserMove(m){
  const L=T.line; const want=L.nodes[T.ply].s;
  if(norm(m.san)===norm(want)){ lastMove=m; T.ply++; clearArrows(); render(); renderPlaying("Good."); stepLine(); }
  else {
    game.undo(); T.mistakes++; render(); wrapEl.classList.remove("shake"); void wrapEl.offsetWidth; wrapEl.classList.add("shake");
    sqEl(m.to).classList.add("bad"); setTimeout(()=>sqEl(m.to).classList.remove("bad"), 500);
    T.hinted=true; clearArrows(); showHintArrow(want);
    renderPlaying(`Not ${m.san}. The repertoire move is ${want}.`, "bad");
  }
}
function renderPlaying(msg, cls){
  const L=T.line; const st=stateOf(L.key);
  $("#movelist").innerHTML = sanText(L.nodes, T.ply, T.ply-1);
  const pct = Math.round(100*T.ply/L.len);
  paneTrain.innerHTML = `
    <div class="status"><span class="chip ${st}">${st==="ok"?"review":st}</span><span class="hint">line ${T.pos+1} of ${T.queue.length}${T.mistakes?` · ${T.mistakes} mistake${T.mistakes>1?"s":""}`:""}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="msg ${cls||""}" id="msg">${msg}</div>
    ${L.nodes[T.ply-1] && L.nodes[T.ply-1].n && T.ply%2===0 ? `<div class="note">${L.nodes[T.ply-1].n}</div>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto">
      <button class="btn small" id="hintBtn">Show hint</button>
      <button class="btn small" id="skipBtn">Skip line</button>
      <button class="btn small" id="quitBtn">End session</button>
    </div>`;
  $("#hintBtn").addEventListener("click", ()=>{ if(T.ply<L.len && T.ply%2===0){ T.hinted=true; T.mistakes++; clearArrows(); showHintArrow(L.nodes[T.ply].s); renderPlaying("Hint shown (counts as a miss)."); } });
  $("#skipBtn").addEventListener("click", nextLine);
  $("#quitBtn").addEventListener("click", renderTrainHome);
  $("#under").innerHTML = `<span class="hint">${T.ply%2===0?"White to move":"Black replies…"}</span>`;
}
function finishLine(){
  interactive=false; T.phase="done"; clearArrows(); const L=T.line; const key=L.key;
  $("#movelist").innerHTML = sanText(L.nodes, null, L.len-1);
  const last=L.nodes[L.len-1];
  if(T.mode==="random"){
    paneTrain.innerHTML = `<div class="msg ${T.mistakes?"bad":"good"}">${T.mistakes?`Finished with ${T.mistakes} mistake${T.mistakes>1?"s":""}.`:"Clean run."}</div>
      ${last.n?`<div class="note">${last.n}</div>`:""}<div style="display:flex;gap:8px;margin-top:auto"><button class="btn primary" id="nextBtn">Next line</button><button class="btn" id="quitBtn">End</button></div>`;
    $("#nextBtn").addEventListener("click", nextLine); $("#quitBtn").addEventListener("click", renderTrainHome); return;
  }
  if(T.mistakes){
    paneTrain.innerHTML = `<div class="msg bad">${T.mistakes} mistake${T.mistakes>1?"s":""}. This line comes back in 10 minutes.</div>
      ${last.n?`<div class="note">${last.n}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:auto"><button class="btn primary" id="nextBtn">Continue</button><button class="btn" id="quitBtn">End session</button></div>`;
    schedule(key,0);
    $("#nextBtn").addEventListener("click", nextLine); $("#quitBtn").addEventListener("click", renderTrainHome);
  } else {
    paneTrain.innerHTML = `<div class="msg good">Clean run. How did it feel?</div>
      ${last.n?`<div class="note">${last.n}</div>`:""}
      <div class="rate">
        <button class="again" data-g="0">Again<small>${previewIvl(key,0)}</small></button>
        <button class="hard" data-g="1">Hard<small>${previewIvl(key,1)}</small></button>
        <button class="good" data-g="2">Good<small>${previewIvl(key,2)}</small></button>
        <button class="easy" data-g="3">Easy<small>${previewIvl(key,3)}</small></button>
      </div><p class="hint">Keys: 1 again · 2 hard · 3 good · 4 easy</p>
      <div style="margin-top:auto"><button class="btn small" id="quitBtn">End session</button></div>`;
    paneTrain.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click", ()=>{ schedule(key, +b.dataset.g); nextLine(); }));
    $("#quitBtn").addEventListener("click", renderTrainHome);
  }
  renderStats();
}
function nextLine(){
  if(T.mode==="single"){ renderTrainHome(); return; }
  T.pos++;
  if(T.mode==="srs"){ // re-queue lapsed lines at the end of this session so they get a second go
    if(T.pos>=T.queue.length){ const again=buildQueue().filter(L=>rec(L.key).state==="learning" && rec(L.key).due<=Date.now()+10*60000 && rec(L.key).ivl===0);
      if(again.length && T.queue.length<LINES.length*3){ T.queue=again; T.pos=0; } else { renderTrainHome(); return; } }
  } else if(T.pos>=T.queue.length){ T.pos=0; }
  startLine(T.queue[T.pos]);
}
document.addEventListener("keydown", e=>{
  if(T.phase==="done" && "1234".includes(e.key) && paneTrain.querySelector(".rate")){ const b=paneTrain.querySelector(`.rate button[data-g="${+e.key-1}"]`); if(b) b.click(); }
  if(T.phase==="done" && e.key==="Enter"){ const b=$("#nextBtn"); if(b) b.click(); }
  if(!$("#pane-explore").hidden){ if(e.key==="ArrowLeft") exploreBack(); if(e.key==="ArrowRight"){ const n=X.node.c&&X.node.c[0]; if(n) exploreGo(n); } }
});

/* ---------- lines tab ---------- */
let lineFilter="all";
function renderLines(){
  const pane=$("#pane-lines"); const c=counts();
  const list = LINES.filter(L=> lineFilter==="all" || stateOf(L.key)===lineFilter);
  pane.innerHTML = `<div class="filters">
      ${[["all","All "+LINES.length],["due","Due "+c.due],["new","New "+c.new],["learn","Learning "+c.learn],["ok","Known "+c.ok]].map(([k,t])=>`<button aria-pressed="${lineFilter===k}" data-f="${k}">${t}</button>`).join("")}
    </div>
    <div class="linelist">${list.map(L=>{ const r=rec(L.key); const st=stateOf(L.key);
      const due = r.state==="new"?"never drilled": (r.due<=Date.now()?"due now":"due "+new Date(r.due).toLocaleDateString());
      return `<div class="linerow"><div class="mv">${lineLabel(L)}</div><button class="btn small" data-drill="${L.idx}">Drill</button>
        <div class="meta"><span class="chip ${st}">${st==="ok"?"known":st}</span><span>${due}</span>${r.reps?`<span>${r.reps} reps · ${r.lapses} lapses</span>`:""}<span>${L.len} plies</span></div></div>`; }).join("")}</div>`;
  pane.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click", ()=>{ lineFilter=b.dataset.f; renderLines(); }));
  pane.querySelectorAll("[data-drill]").forEach(b=>b.addEventListener("click", ()=>drillOne(LINES[+b.dataset.drill])));
}

/* ---------- explore tab ---------- */
const X = { path:[], node:REP };
function exploreGo(node){ X.path.push(node); X.node=node; renderExplore(); }
function exploreBack(){ if(!X.path.length) return; X.path.pop(); X.node = X.path.length? X.path[X.path.length-1] : REP; renderExplore(); }
function exploreTo(i){ X.path=X.path.slice(0,i+1); X.node = X.path.length? X.path[X.path.length-1] : REP; renderExplore(); }
function renderExplore(entering){
  interactive=false; clearTimeout(T.timer); if(T.phase!=="idle"){ T.phase="idle"; }
  const pane=$("#pane-explore");
  game.reset(); lastMove=null; X.path.forEach(n=>playSan(n.s)); render(); clearArrows();
  if(X.node.c && X.node.c.length && X.node.c.length===1 && X.path.length%2===0){ /* white rep move */ }
  $("#movelist").innerHTML = X.path.length? sanText(X.path, null, X.path.length-1) : "<span class='hint'>Start position</span>";
  $("#under").innerHTML = `<button class="btn small" id="xback" ${X.path.length?"":"disabled"}>← Back</button><button class="btn small" id="xroot" ${X.path.length?"":"disabled"}>Start</button><span class="hint">← → keys walk the trunk</span>`;
  $("#xback").addEventListener("click", exploreBack); $("#xroot").addEventListener("click", ()=>exploreTo(-1));
  const wtm = X.path.length%2===0;
  const kids = X.node.c||[];
  const tot = kids.reduce((s,k)=>s+(k.g||0),0);
  pane.innerHTML = `
    <div class="crumbs">${X.path.length? X.path.map((n,i)=>`${i%2===0?`<span class="n" style="color:var(--muted)">${i/2+1}.</span>`:""}<button class="${i===X.path.length-1?"cur":""}" data-i="${i}">${n.s}</button> `).join("") : "<span class='hint'>Start position — click a move to walk the tree.</span>"}</div>
    ${X.node.n?`<div class="note">${X.node.n}</div>`:""}
    <div class="hint">${wtm?"White to move · ★ repertoire move":"Black to move · every reply below has its own line"}${X.node.g?` · ${X.node.g.toLocaleString()} games reached this position`:""}</div>
    <div class="cands">${kids.map((k,i)=>{ const g=k.g||0, w=k.w||0, d=k.d||0, b=k.b||0, s=(w+d+b)||1; const has=w+d+b>0;
      return `<button class="cand ${wtm?"rep":""}" data-k="${i}"><span class="san">${k.s}</span><span class="bar" title="${has?`White ${Math.round(100*w/s)}% · draw ${Math.round(100*d/s)}% · Black ${Math.round(100*b/s)}%`:""}"><i class="w" style="width:${has?100*w/s:50}%"></i><i class="d" style="width:${has?100*d/s:0}%"></i><i class="b" style="width:${has?100*b/s:50}%"></i></span><span class="g">${has?g.toLocaleString()+" games · W "+Math.round(100*(w+d/2)/s)+"%":""}</span></button>`; }).join("")}
      ${kids.length?"":"<div class='hint'>End of the repertoire line. Play on with general principles.</div>"}</div>
    ${!kids.length && X.path.length? `<div><button class="btn primary small" id="xdrill">Drill this line</button></div>`:""}`;
  pane.querySelectorAll(".crumbs button").forEach(b=>b.addEventListener("click", ()=>exploreTo(+b.dataset.i)));
  pane.querySelectorAll(".cand[data-k]").forEach(b=>b.addEventListener("click", ()=>exploreGo(kids[+b.dataset.k])));
  const xd=$("#xdrill"); if(xd) xd.addEventListener("click", ()=>{ const key=X.path.map(n=>n.s).join(" "); const L=LINES.find(l=>l.key===key); if(L) drillOne(L); });
}

/* ---------- settings ---------- */
function renderSettings(){
  const pane=$("#pane-settings");
  pane.innerHTML = `<h2 style="font-size:1.1rem">Settings</h2>
    <div class="kv">
      <label for="s-new">New lines per day</label><input id="s-new" type="number" min="0" max="100" value="${settings.newPerDay}">
      <label for="s-hints">Show the move arrow on new lines</label><input id="s-hints" type="checkbox" ${settings.hintsNew?"checked":""}>
      <label for="s-start">Start lines at 5.Ng5 (skip the first four moves)</label><input id="s-start" type="checkbox" ${settings.startAtGambit?"checked":""}>
      <label for="s-coords">Show coordinates</label><input id="s-coords" type="checkbox" ${settings.showCoords?"checked":""}>
      <label for="s-speed">Black reply delay (ms)</label><input id="s-speed" type="number" min="0" max="3000" step="50" value="${settings.autoSpeed}">
    </div>
    <h3 style="font-size:.95rem">Progress</h3>
    <p class="hint">Progress lives in this browser only. Export it to move to another device.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="s-export">Copy progress JSON</button><button class="btn small" id="s-import">Paste progress JSON</button><button class="btn small" id="s-reset" style="color:var(--bad)">Reset all progress</button></div>
    <textarea id="s-box" style="width:100%;min-height:90px;font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px" placeholder="Progress JSON appears here / paste here"></textarea>
    <div id="s-msg" class="hint"></div>`;
  const save=()=>{ settings.newPerDay=+$("#s-new").value||0; settings.hintsNew=$("#s-hints").checked; settings.startAtGambit=$("#s-start").checked; settings.showCoords=$("#s-coords").checked; settings.autoSpeed=+$("#s-speed").value||0; store.set("agr-settings",settings); render(); renderStats(); };
  ["s-new","s-hints","s-start","s-coords","s-speed"].forEach(id=>$("#"+id).addEventListener("change", save));
  $("#s-export").addEventListener("click", ()=>{ const txt=JSON.stringify({srs,daily,settings}); $("#s-box").value=txt; navigator.clipboard.writeText(txt).then(()=>$("#s-msg").textContent="Copied.").catch(()=>{ $("#s-box").select(); $("#s-msg").textContent="Select the text above and copy it."; }); });
  $("#s-import").addEventListener("click", ()=>{ try{ const o=JSON.parse($("#s-box").value); if(o.srs){ srs=o.srs; store.set("agr-srs",srs);} if(o.daily){ daily=o.daily; store.set("agr-daily",daily);} $("#s-msg").textContent="Progress imported."; renderStats(); }catch(e){ $("#s-msg").textContent="That is not valid progress JSON."; } });
  let armed=false; $("#s-reset").addEventListener("click", ()=>{ if(!armed){ armed=true; $("#s-reset").textContent="Click again to confirm reset"; return; } srs={}; store.set("agr-srs",srs); daily={day:today(),introduced:0}; store.set("agr-daily",daily); armed=false; $("#s-reset").textContent="Reset all progress"; $("#s-msg").textContent="Progress cleared."; renderStats(); });
}

/* ---------- boot ---------- */
render(); renderTrainHome();
</script>

</body>
</html>
